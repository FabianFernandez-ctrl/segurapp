<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SegurApp — Gestión de Cartera</title>
  <style>
/* ── RESET & BASE (Mantenidos) ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #f8fafc;
  --bg2:       #f1f5f9;
  --white:     #ffffff;
  --border:    #e2e8f0;
  --border2:   #cbd5e1;
  --text:      #0f172a;
  --text2:     #475569;
  --text3:     #94a3b8;
  --blue:      #185FA5;
  --blue-light:#E6F1FB;
  --blue-dark: #0C447C;
  --green:     #3B6D11;
  --green-bg:  #EAF3DE;
  --amber:     #854F0B;
  --amber-bg:  #FAEEDA;
  --red:       #A32D2D;
  --red-bg:    #FCEBEB;
  --radius:    8px;
  --radius-lg: 12px;
  --shadow:    0 1px 3px rgba(0,0,0,.08);
}

body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

/* ── STEPPER UI ───────────────────────────────── */
.stepper { display: flex; justify-content: space-between; margin-bottom: 24px; position: relative; }
.stepper::before { content: ""; position: absolute; top: 15px; left: 0; right: 0; height: 2px; background: var(--border); z-index: 1; }
.step { position: relative; z-index: 2; background: var(--bg); padding: 0 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.step-circle { width: 32px; height: 32px; border-radius: 50%; background: var(--white); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text3); }
.step.active .step-circle { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
.step.completed .step-circle { background: var(--blue); border-color: var(--blue); color: #fff; }
.step-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text3); }
.step.active .step-label { color: var(--blue); }

/* ── ESTILOS EXISTENTES (Sincronizados) ───────── */
.login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
.login-box { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px 36px; width: 380px; box-shadow: var(--shadow); }
.login-logo { text-align: center; margin-bottom: 28px; }
.logo-icon { width: 48px; height: 48px; background: var(--blue); color: #fff; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
.login-logo h1 { font-size: 20px; font-weight: 600; }
#app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 224px; flex-shrink: 0; background: var(--white); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
.sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 18px 16px; border-bottom: 1px solid var(--border); }
.logo-icon-sm { width: 32px; height: 32px; background: var(--blue); color: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0; }
.nav { flex: 1; padding: 10px 8px; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--text2); margin-bottom: 2px; }
.nav-item.active { background: var(--blue-light); color: var(--blue); font-weight: 500; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { background: var(--white); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
.content { flex: 1; overflow-y: auto; padding: 20px; }
.card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; }
.form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.form-group label { font-size: 12px; font-weight: 500; color: var(--text2); }
input, select, textarea { width: 100%; padding: 8px 11px; border: 1px solid var(--border2); border-radius: var(--radius); font-size: 13px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border2); background: var(--white); }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--white); border-radius: var(--radius-lg); width: 640px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.form-col-full { grid-column: 1 / -1; }
.badge { padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-blue { background: var(--blue-light); color: var(--blue-dark); }
</style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- LOGIN/APP (Estructura base) -->
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <div class="login-logo"><div class="logo-icon">S</div><h1>SegurApp</h1><p>Gestión de cartera</p></div>
      <button class="btn btn-primary" style="width:100%" onclick="loginSimulado()">Ingresar al Sistema</button>
    </div>
  </div>

  <div id="app" style="display:none">
    <aside class="sidebar">
      <div class="sidebar-logo"><div class="logo-icon-sm">S</div><div><div class="sidebar-title">SegurApp</div></div></div>
      <nav class="nav">
        <div class="nav-item active" onclick="showSection('polizas')">Pólizas</div>
        <div class="nav-item" onclick="showSection('clientes')">Clientes</div>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <h2 id="page-title">Pólizas</h2>
        <button class="btn btn-primary" onclick="openPolizaWizard()">+ Nueva Póliza</button>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- MODAL WIZARD -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-body">
        <div class="stepper" id="wizard-stepper">
          <div class="step active" id="step-1">
            <div class="step-circle">1</div>
            <div class="step-label">Cliente</div>
          </div>
          <div class="step" id="step-2">
            <div class="step-circle">2</div>
            <div class="step-label">Bien</div>
          </div>
          <div class="step" id="step-3">
            <div class="step-circle">3</div>
            <div class="step-label">Póliza</div>
          </div>
        </div>
        
        <div id="wizard-content">
          <!-- Dinámico -->
        </div>
      </div>
      <div class="modal-footer" id="wizard-footer">
        <!-- Dinámico -->
      </div>
    </div>
  </div>

  <script>
    // ── ESTADO Y DATOS ──────────────────────────────
    const state = {
      currentStep: 1,
      wizardData: {
        cliente: {},
        bien: {},
        poliza: {}
      },
      db: {
        clientes: [{id: 'c1', nombre: 'Juan Pérez', dni: '20-12345678-9'}],
        bienes: [],
        polizas: []
      }
    };

    function loginSimulado() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      renderList();
    }

    // ── WIZARD LOGIC ────────────────────────────────
    function openPolizaWizard() {
      state.currentStep = 1;
      state.wizardData = { cliente: {}, bien: {}, poliza: {} };
      document.getElementById('modal-overlay').style.display = 'flex';
      renderStep();
    }

    function closeWizard() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    function renderStep() {
      const container = document.getElementById('wizard-content');
      const footer = document.getElementById('wizard-footer');
      
      // Actualizar Stepper
      document.querySelectorAll('.step').forEach((el, idx) => {
        el.className = 'step ' + (idx + 1 === state.currentStep ? 'active' : (idx + 1 < state.currentStep ? 'completed' : ''));
      });

      if (state.currentStep === 1) {
        container.innerHTML = `
          <h3>Datos del Cliente</h3>
          <div class="form-group">
            <label>Buscar cliente existente o ingresar nuevo</label>
            <input type="text" id="w-cli-nombre" list="clientes-list" placeholder="Nombre completo o Razón Social" onchange="checkExisting(this.value)">
            <datalist id="clientes-list">${state.db.clientes.map(c => `<option value="${c.nombre}">`).join('')}</datalist>
          </div>
          <div class="form-grid">
            <div class="form-group"><label>DNI / CUIT</label><input type="text" id="w-cli-dni"></div>
            <div class="form-group"><label>Teléfono</label><input type="text" id="w-cli-tel"></div>
          </div>`;
        footer.innerHTML = `<button class="btn" onclick="closeWizard()">Cancelar</button><button class="btn btn-primary" onclick="nextStep()">Siguiente: Datos del Bien</button>`;
      } 
      else if (state.currentStep === 2) {
        container.innerHTML = `
          <h3>Datos del Bien Asegurado</h3>
          <div class="form-group">
            <label>Tipo de Bien</label>
            <select id="w-bien-tipo">
              <option value="automotor">Automotor</option>
              <option value="hogar">Inmueble / Hogar</option>
              <option value="vida">Persona (Vida)</option>
            </select>
          </div>
          <div class="form-grid">
            <div class="form-group"><label>Identificación (Patente/Dirección)</label><input type="text" id="w-bien-id"></div>
            <div class="form-group"><label>Descripción / Marca</label><input type="text" id="w-bien-desc"></div>
          </div>`;
        footer.innerHTML = `<button class="btn" onclick="prevStep()">Volver</button><button class="btn btn-primary" onclick="nextStep()">Siguiente: Datos Póliza</button>`;
      }
      else {
        container.innerHTML = `
          <h3>Datos de la Póliza</h3>
          <div class="form-grid">
            <div class="form-group"><label>Nro. de Póliza</label><input type="text" id="w-pol-nro"></div>
            <div class="form-group"><label>Compañía</label><input type="text" id="w-pol-cia"></div>
            <div class="form-group"><label>Vigencia Hasta</label><input type="date" id="w-pol-venc"></div>
            <div class="form-group"><label>Suma Asegurada ($)</label><input type="number" id="w-pol-suma"></div>
          </div>`;
        footer.innerHTML = `<button class="btn" onclick="prevStep()">Volver</button><button class="btn btn-primary" onclick="finalSave()">Emitir y Vincular</button>`;
      }
    }

    function nextStep() {
      saveCurrentData();
      state.currentStep++;
      renderStep();
    }

    function prevStep() {
      state.currentStep--;
      renderStep();
    }

    function saveCurrentData() {
      if (state.currentStep === 1) {
        state.wizardData.cliente = {
          nombre: document.getElementById('w-cli-nombre').value,
          dni: document.getElementById('w-cli-dni').value,
          tel: document.getElementById('w-cli-tel').value
        };
      } else if (state.currentStep === 2) {
        state.wizardData.bien = {
          tipo: document.getElementById('w-bien-tipo').value,
          ident: document.getElementById('w-bien-id').value,
          desc: document.getElementById('w-bien-desc').value
        };
      }
    }

    async function finalSave() {
      // 1. Guardar/Vincular Cliente
      let cliente = state.db.clientes.find(c => c.nombre === state.wizardData.cliente.nombre);
      if (!cliente) {
        cliente = { id: 'cli_' + Date.now(), ...state.wizardData.cliente };
        state.db.clientes.push(cliente);
      }

      // 2. Guardar Bien
      const bien = { id: 'bien_' + Date.now(), clienteId: cliente.id, ...state.wizardData.bien };
      state.db.bienes.push(bien);

      // 3. Guardar Póliza con vínculos
      const poliza = {
        id: 'pol_' + Date.now(),
        nro: document.getElementById('w-pol-nro').value,
        cia: document.getElementById('w-pol-cia').value,
        venc: document.getElementById('w-pol-venc').value,
        suma: document.getElementById('w-pol-suma').value,
        clienteId: cliente.id,
        bienId: bien.id
      };
      state.db.polizas.push(poliza);

      alert('¡Póliza vinculada con éxito!\nCliente: ' + cliente.nombre + '\nBien: ' + bien.ident);
      closeWizard();
      renderList();
      runAutomatedTest(poliza.id);
    }

    function renderList() {
      const content = document.getElementById('content');
      if (state.db.polizas.length === 0) {
        content.innerHTML = '<div class="card">No hay pólizas emitidas.</div>';
        return;
      }

      const rows = state.db.polizas.map(p => {
        const cli = state.db.clientes.find(c => c.id === p.clienteId);
        const bien = state.db.bienes.find(b => b.id === p.bienId);
        return `
          <tr>
            <td><strong>${p.nro}</strong></td>
            <td>${cli ? cli.nombre : 'Error'}</td>
            <td><span class="badge badge-blue">${bien ? bien.tipo : ''}</span> ${bien ? bien.ident : ''}</td>
            <td>${p.cia}</td>
            <td>${p.venc}</td>
          </tr>`;
      }).join('');

      content.innerHTML = `
        <div class="card">
          <table style="width:100%; border-collapse: collapse;">
            <thead><tr style="text-align:left; border-bottom: 1px solid #eee"><th>Póliza</th><th>Cliente</th><th>Bien Asegurado</th><th>Compañía</th><th>Vencimiento</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    // ── PRUEBAS AUTOMÁTICAS (Requerimiento 4) ────────
    function runAutomatedTest(polizaId) {
      console.log("Iniciando Verificación de Integridad...");
      const pol = state.db.polizas.find(p => p.id === polizaId);
      const cli = state.db.clientes.find(c => c.id === pol.clienteId);
      const bien = state.db.bienes.find(b => b.id === pol.bienId);

      const success = pol && cli && bien && bien.clienteId === cli.id;
      
      if (success) {
        console.log("✅ TEST PASSED: Vínculo Cliente <-> Bien <-> Póliza consistente.");
      } else {
        console.error("❌ TEST FAILED: Error en la relación de entidades.");
      }
    }

    function checkExisting(val) {
      const exist = state.db.clientes.find(c => c.nombre === val);
      if (exist) {
        document.getElementById('w-cli-dni').value = exist.dni;
        document.getElementById('w-cli-tel').value = exist.tel || '';
      }
    }
  </script>
</body>
</html>
