<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SegurApp — Gestión Integral de Cartera</title>
  <style>
/* ── VARIABLE SYSTEM ──────────────────────────── */
:root {
  --primary:    #185FA5;
  --primary-dark: #0C447C;
  --primary-soft: #E6F1FB;
  --success:    #3B6D11;
  --success-bg: #EAF3DE;
  --warning:    #854F0B;
  --warning-bg: #FAEEDA;
  --danger:     #A32D2D;
  --danger-bg:  #FCEBEB;
  --bg-main:    #f8fafc;
  --bg-card:    #ffffff;
  --border:     #e2e8f0;
  --text-main:  #0f172a;
  --text-muted: #64748b;
  --radius:     8px;
  --radius-lg:  12px;
  --shadow:     0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
}

/* ── RESET & BASE ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
  background: var(--bg-main); 
  color: var(--text-main); 
  font-size: 14px; 
  line-height: 1.6;
}

/* ── LAYOUT ───────────────────────────────────── */
#app-container { display: flex; height: 100vh; overflow: hidden; }

/* ── SIDEBAR ──────────────────────────────────── */
.sidebar {
  width: 240px; background: var(--bg-card); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.sidebar-header {
  padding: 24px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.logo-box {
  width: 36px; height: 36px; background: var(--primary); color: white;
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 18px;
}
.sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: var(--radius); cursor: pointer; color: var(--text-muted);
  transition: all 0.2s; margin-bottom: 4px; text-decoration: none;
}
.nav-item:hover { background: var(--bg-main); color: var(--text-main); }
.nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.user-avatar { 
  width: 32px; height: 32px; background: var(--primary-soft); color: var(--primary);
  border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600;
}

/* ── TOPBAR & MAIN ────────────────────────────── */
.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
}
.topbar-title h2 { font-size: 18px; font-weight: 600; }
.topbar-actions { display: flex; gap: 12px; }
.content-area { flex: 1; overflow-y: auto; padding: 24px; }

/* ── AUTH SCREENS ─────────────────────────────── */
.auth-wrapper {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-main);
}
.auth-card {
  background: var(--bg-card); padding: 40px; border-radius: var(--radius-lg);
  border: 1px solid var(--border); box-shadow: var(--shadow); width: 100%; max-width: 400px;
}
.auth-header { text-align: center; margin-bottom: 32px; }

/* ── TABLES ───────────────────────────────────── */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.table-responsive { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 12px 16px; background: #fcfcfd; color: var(--text-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid var(--border); }
td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }

/* ── UI COMPONENTS ────────────────────────────── */
.btn {
  padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border);
  background: white; cursor: pointer; font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;
}
.btn-primary { background: var(--primary); color: white; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

.badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-info { background: var(--primary-soft); color: var(--primary); }

.input { 
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-family: inherit; font-size: 14px; outline: none;
}
.input:focus { border-color: var(--primary); ring: 2px var(--primary-soft); }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: var(--text-muted); }

/* ── MODALS ───────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
  display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px);
}
.modal-content {
  background: white; border-radius: var(--radius-lg); width: 600px; max-width: 95%;
  max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
}
.modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-body { padding: 24px; overflow-y: auto; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }

/* ── LOADING ──────────────────────────────────── */
#loader { 
  position: fixed; inset: 0; background: white; z-index: 9999; 
  display: flex; flex-direction: column; align-items: center; justify-content: center; 
}
.spinner { width: 40px; height: 40px; border: 4px solid var(--primary-soft); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── DASHBOARD STATS ──────────────────────────── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 24px; }
.stat-box { background: white; padding: 20px; border-radius: var(--radius-lg); border: 1px solid var(--border); }
.stat-val { font-size: 24px; font-weight: 700; color: var(--primary); margin-top: 4px; }

  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- LOADER -->
  <div id="loader">
    <div class="spinner"></div>
    <p style="margin-top:16px; color:var(--text-muted)">Cargando SegurApp...</p>
  </div>

  <!-- AUTH: LOGIN -->
  <div id="auth-login" class="auth-wrapper" style="display:none">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-box" style="margin: 0 auto 16px;">S</div>
        <h2>Bienvenido</h2>
        <p style="color:var(--text-muted)">Ingresa tus credenciales para continuar</p>
      </div>
      <form id="form-login">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" class="input" id="login-email" required placeholder="ejemplo@oficina.com">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" class="input" id="login-password" required placeholder="••••••••">
        </div>
        <div id="login-error" style="color:var(--danger); font-size:12px; margin-bottom:12px; display:none"></div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px">Iniciar Sesión</button>
      </form>
      <p style="text-align:center; margin-top:20px; font-size:13px">
        ¿No tienes cuenta? <a href="#" onclick="toggleAuth('register')" style="color:var(--primary); font-weight:500; text-decoration:none">Regístrate</a>
      </p>
    </div>
  </div>

  <!-- AUTH: REGISTER -->
  <div id="auth-register" class="auth-wrapper" style="display:none">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Crear Cuenta</h2>
        <p style="color:var(--text-muted)">Únete a la plataforma de gestión</p>
      </div>
      <form id="form-register">
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" class="input" id="reg-name" required>
        </div>
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" class="input" id="reg-email" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" class="input" id="reg-password" required minlength="6">
        </div>
        <div id="reg-error" style="color:var(--danger); font-size:12px; margin-bottom:12px; display:none"></div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:12px">Registrarse</button>
      </form>
      <p style="text-align:center; margin-top:20px; font-size:13px">
        ¿Ya tienes cuenta? <a href="#" onclick="toggleAuth('login')" style="color:var(--primary); font-weight:500; text-decoration:none">Inicia sesión</a>
      </p>
    </div>
  </div>

  <!-- APP MAIN CONTAINER -->
  <div id="app-container" style="display:none">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-box">S</div>
        <div>
          <h1 style="font-size:16px; font-weight:700">SegurApp</h1>
          <p style="font-size:11px; color:var(--text-muted)">Gestión de Cartera</p>
        </div>
      </div>
      <nav class="sidebar-nav" id="nav-list">
        <!-- Rendered by JS -->
      </nav>
      <div class="sidebar-footer">
        <div class="user-avatar" id="nav-user-initials">U</div>
        <div style="flex:1; overflow:hidden">
          <p id="nav-user-name" style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis"></p>
          <p id="nav-user-email" style="font-size:11px; color:var(--text-muted)"></p>
        </div>
        <button onclick="handleLogout()" class="btn btn-sm" title="Salir" style="padding:4px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-title">
          <h2 id="current-section-title">Escritorio</h2>
        </div>
        <div class="topbar-actions">
          <input type="text" id="global-search" class="input" placeholder="Buscar..." style="width:240px; padding:6px 12px">
          <button class="btn btn-primary" onclick="openCreateModal()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
            Nuevo Registro
          </button>
        </div>
      </header>

      <div class="content-area" id="main-view">
        <!-- Dynamic Content -->
      </div>
    </main>
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Título del Formulario</h3>
        <button onclick="closeModal()" style="background:none; border:none; cursor:pointer; font-size:20px; color:var(--text-muted)">×</button>
      </div>
      <form id="modal-form">
        <div class="modal-body" id="modal-body-content">
          <!-- Dynamic Form Fields -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="modal-submit-btn">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FIREBASE SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ═══════════════════════════════════════════════
    //  CONFIGURACIÓN FIREBASE
    // ═══════════════════════════════════════════════
    const firebaseConfig = {
      apiKey: "AIzaSyAN6xprjeAfylXPil66J7SypbCtsR1SlXE",
      authDomain: "segurapps-alternativa.firebaseapp.com",
      projectId: "segurapps-alternativa",
      storageBucket: "segurapps-alternativa.firebasestorage.app",
      messagingSenderId: "531374066144",
      appId: "1:531374066144:web:03df43305498d3b99dc385"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ── GLOBAL STATE ───────────────────────────────
    window.appState = {
      user: null,
      currentSection: 'dashboard',
      data: {
        clientes: [], polizas: [], bienes: [], siniestros: [], productores: [], companias: []
      },
      editingId: null,
      loading: true
    };

    // ── CORE FUNCTIONS ─────────────────────────────
    const sections = [
      { id: 'dashboard', label: 'Inicio', icon: 'M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.5z' },
      { id: 'clientes', label: 'Clientes', icon: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },
      { id: 'polizas', label: 'Pólizas', icon: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6' },
      { id: 'siniestros', label: 'Siniestros', icon: 'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01' },
      { id: 'bienes', label: 'Bienes', icon: 'M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C20 9.7 19 8 19 8L15 2H9L5 8s-1 1.7-1.5 3.1c-.8.2-1.5 1-1.5 1.9v3c0 .6.4 1 1 1h2 M7 17a3 3 0 1 0 0 6 3 3 0 0 0 0-6z M17 17a3 3 0 1 0 0 6 3 3 0 0 0 0-6z' },
      { id: 'productores', label: 'Productores', icon: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M23 21v-2a4 4 0 0 0-3-3.87 M17 11a4 4 0 1 1-2.29-3.66' },
      { id: 'companias', label: 'Compañías', icon: 'M3 21h18M3 7h18M5 7V3h14v4M5 21V7m14 14V7m-7 14v-4m0-4v-4' },
      { id: 'vencimientos', label: 'Vencimientos', icon: 'M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z M16 2v4 M8 2v4 M3 10h18' }
    ];

    window.refreshUI = () => {
      const navList = document.getElementById('nav-list');
      navList.innerHTML = sections.map(s => `
        <a class="nav-item ${window.appState.currentSection === s.id ? 'active' : ''}" onclick="setSection('${s.id}')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${s.icon}"/></svg>
          <span>${s.label}</span>
        </a>
      `).join('');
      document.getElementById('current-section-title').textContent = sections.find(s => s.id === window.appState.currentSection).label;
      renderActiveSection();
    };

    window.setSection = (id) => {
      window.appState.currentSection = id;
      window.refreshUI();
    };

    // ── DATA SYNC ──────────────────────────────────
    async function loadData() {
      const cols = ['clientes', 'polizas', 'bienes', 'siniestros', 'productores', 'companias'];
      const promises = cols.map(async name => {
        const snap = await getDocs(query(collection(db, name), orderBy('creadoEn', 'desc')));
        window.appState.data[name] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      });
      await Promise.all(promises);
    }

    // ── AUTH LOGIC ─────────────────────────────────
    onAuthStateChanged(auth, async user => {
      document.getElementById('loader').style.display = 'flex';
      if (user) {
        window.appState.user = user;
        document.getElementById('nav-user-name').textContent = user.displayName || 'Usuario';
        document.getElementById('nav-user-email').textContent = user.email;
        document.getElementById('nav-user-initials').textContent = (user.displayName || 'U')[0].toUpperCase();
        await loadData();
        document.getElementById('auth-login').style.display = 'none';
        document.getElementById('auth-register').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        window.refreshUI();
      } else {
        document.getElementById('app-container').style.display = 'none';
        document.getElementById('auth-login').style.display = 'flex';
      }
      document.getElementById('loader').style.display = 'none';
    });

    window.handleLogout = () => signOut(auth);

    document.getElementById('form-login').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        const el = document.getElementById('login-error');
        el.textContent = "Error: Credenciales inválidas.";
        el.style.display = 'block';
      }
    };

    document.getElementById('form-register').onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-password').value;
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
      } catch (err) {
        const el = document.getElementById('reg-error');
        el.textContent = "Error al crear cuenta: " + err.message;
        el.style.display = 'block';
      }
    };

    window.toggleAuth = (view) => {
      document.getElementById('auth-login').style.display = view === 'login' ? 'flex' : 'none';
      document.getElementById('auth-register').style.display = view === 'register' ? 'flex' : 'none';
    };

    // ── CRUD OPERATIONS ────────────────────────────
    window.saveRecord = async (e) => {
      e.preventDefault();
      const section = window.appState.currentSection;
      const formData = new FormData(document.getElementById('modal-form'));
      const payload = Object.fromEntries(formData.entries());
      
      payload.creadoEn = serverTimestamp();
      payload.updatedBy = window.appState.user.uid;

      try {
        document.getElementById('modal-submit-btn').disabled = true;
        document.getElementById('modal-submit-btn').textContent = 'Guardando...';
        
        if (window.appState.editingId) {
          await updateDoc(doc(db, section, window.appState.editingId), payload);
        } else {
          await addDoc(collection(db, section), payload);
        }
        
        await loadData();
        closeModal();
        window.refreshUI();
      } catch (err) {
        alert("Error al guardar: " + err.message);
      } finally {
        document.getElementById('modal-submit-btn').disabled = false;
        document.getElementById('modal-submit-btn').textContent = 'Guardar Cambios';
      }
    };

    window.deleteItem = async (id) => {
      if (!confirm("¿Está seguro de eliminar este registro?")) return;
      const section = window.appState.currentSection;
      await deleteDoc(doc(db, section, id));
      await loadData();
      window.refreshUI();
    };

    // ── ATTACH TO WINDOW ───────────────────────────
    window.openCreateModal = () => openFormModal();
    window.closeModal = () => { document.getElementById('modal').style.display = 'none'; window.appState.editingId = null; };
    document.getElementById('modal-form').onsubmit = window.saveRecord;

    // ── RENDERING LOGIC ─────────────────────────────
    function renderActiveSection() {
      const view = document.getElementById('main-view');
      const section = window.appState.currentSection;
      const data = window.appState.data;

      if (section === 'dashboard') {
        view.innerHTML = renderDashboard(data);
      } else if (section === 'vencimientos') {
        view.innerHTML = renderVencimientos(data.polizas);
      } else {
        view.innerHTML = renderTable(section, data[section]);
      }
    }

    function renderDashboard(data) {
      const activePol = data.polizas.filter(p => p.estado === 'Vigente').length;
      const totalClientes = data.clientes.length;
      const openSiniestros = data.siniestros.filter(s => s.estado !== 'Cerrado').length;

      return `
        <div class="stats-grid">
          <div class="stat-box"><p class="form-group"><label>Clientes Totales</label></p><div class="stat-val">${totalClientes}</div></div>
          <div class="stat-box"><p class="form-group"><label>Pólizas Vigentes</label></p><div class="stat-val">${activePol}</div></div>
          <div class="stat-box"><p class="form-group"><label>Siniestros Activos</label></p><div class="stat-val" style="color:var(--warning)">${openSiniestros}</div></div>
        </div>
        <div class="card">
          <div class="modal-header"><h3>Actividad Reciente</h3></div>
          <div class="table-responsive">
            <table>
              <thead><tr><th>Tipo</th><th>Referencia</th><th>Fecha</th></tr></thead>
              <tbody>
                ${data.polizas.slice(0, 5).map(p => `<tr><td><span class="badge badge-info">Póliza</span></td><td>${p.nro} - ${p.cliente}</td><td>Reciente</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderTable(type, items) {
      if (!items || items.length === 0) return `<div style="text-align:center; padding:40px; color:var(--text-muted)">No hay registros encontrados.</div>`;
      
      const config = {
        clientes: { cols: ['Nombre', 'DNI/CUIT', 'Email', 'Teléfono'], fields: ['nombre', 'dni', 'email', 'tel_cel'] },
        polizas: { cols: ['Nro Póliza', 'Cliente', 'Compañía', 'Ramo', 'Estado'], fields: ['nro', 'cliente', 'compania', 'ramo', 'estado'] },
        siniestros: { cols: ['Nro', 'Fecha', 'Cliente', 'Estado'], fields: ['nro', 'fecha', 'cliente', 'estado'] },
        bienes: { cols: ['Tipo', 'Identificación', 'Cliente', 'Valor'], fields: ['tipo', 'patente', 'cliente', 'valor'] },
        productores: { cols: ['Nombre', 'Matrícula', 'Email'], fields: ['nombre', 'matricula', 'email'] },
        companias: { cols: ['Compañía', 'CUIT', 'Contacto'], fields: ['nombre', 'cuit', 'contacto'] }
      };

      const c = config[type];
      return `
        <div class="card">
          <div class="table-responsive">
            <table>
              <thead>
                <tr>${c.cols.map(h => `<th>${h}</th>`).join('')}<th>Acciones</th></tr>
              </thead>
              <tbody>
                ${items.map(item => `
                  <tr>
                    ${c.fields.map(f => `<td>${f === 'estado' ? renderStatusBadge(item[f]) : (item[f] || '—')}</td>`).join('')}
                    <td>
                      <button class="btn btn-sm" onclick="openEditModal('${type}', '${item.id}')">Editar</button>
                      <button class="btn btn-sm btn-danger" onclick="deleteItem('${item.id}')">Eliminar</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderVencimientos(polizas) {
      const sorted = [...polizas].filter(p => p.venc_hasta).sort((a,b) => new Date(a.venc_hasta) - new Date(b.venc_hasta));
      return `
        <div class="card">
          <div class="table-responsive">
            <table>
              <thead><tr><th>Fecha Vencimiento</th><th>Días</th><th>Póliza</th><th>Cliente</th><th>Estado</th></tr></thead>
              <tbody>
                ${sorted.map(p => {
                  const diff = Math.ceil((new Date(p.venc_hasta) - new Date()) / (1000*60*60*24));
                  const color = diff < 0 ? 'var(--danger)' : (diff < 15 ? 'var(--warning)' : 'var(--success)');
                  return `<tr>
                    <td style="font-weight:600">${p.venc_hasta}</td>
                    <td style="color:${color}; font-weight:700">${diff < 0 ? 'Vencida' : diff + ' días'}</td>
                    <td>${p.nro}</td>
                    <td>${p.cliente}</td>
                    <td>${renderStatusBadge(p.estado)}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderStatusBadge(st) {
      const s = (st || '').toLowerCase();
      if (['vigente', 'activo', 'cerrado'].includes(s)) return `<span class="badge badge-success">${st}</span>`;
      if (['pendiente', 'proceso', 'trámite'].includes(s)) return `<span class="badge badge-warning">${st}</span>`;
      return `<span class="badge badge-danger">${st}</span>`;
    }

    // ── FORM BUILDER ───────────────────────────────
    window.openEditModal = (type, id) => {
      const item = window.appState.data[type].find(i => i.id === id);
      window.appState.editingId = id;
      openFormModal(item);
    };

    function openFormModal(data = {}) {
      const section = window.appState.currentSection;
      const title = (window.appState.editingId ? 'Editar' : 'Nuevo') + ' ' + section.slice(0,-1);
      document.getElementById('modal-title').textContent = title;
      
      const content = document.getElementById('modal-body-content');
      content.innerHTML = getFormFields(section, data);
      
      document.getElementById('modal').style.display = 'flex';
    }

    function getFormFields(sec, d) {
      const D = window.appState.data;
      const opt = (arr, valField, labelField, selected) => arr.map(i => `<option value="${i[valField]}" ${i[valField] === selected ? 'selected' : ''}>${i[labelField]}</option>`).join('');

      if (sec === 'clientes') return `
        <div class="form-group"><label>Nombre Completo *</label><input type="text" name="nombre" class="input" value="${d.nombre||''}" required></div>
        <div class="form-group"><label>DNI / CUIT</label><input type="text" name="dni" class="input" value="${d.dni||''}"></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" class="input" value="${d.email||''}"></div>
        <div class="form-group"><label>Celular</label><input type="text" name="tel_cel" class="input" value="${d.tel_cel||''}"></div>
        <div class="form-group"><label>Domicilio</label><input type="text" name="domicilio" class="input" value="${d.domicilio||''}"></div>
      `;

      if (sec === 'polizas') return `
        <div class="form-group"><label>Nro Póliza *</label><input type="text" name="nro" class="input" value="${d.nro||''}" required></div>
        <div class="form-group"><label>Cliente *</label><select name="cliente" class="input" required><option value="">Seleccionar...</option>${opt(D.clientes, 'nombre', 'nombre', d.cliente)}</select></div>
        <div class="form-group"><label>Compañía *</label><select name="compania" class="input" required><option value="">Seleccionar...</option>${opt(D.companias, 'nombre', 'nombre', d.compania)}</select></div>
        <div class="form-group"><label>Ramo</label><input type="text" name="ramo" class="input" value="${d.ramo||''}" placeholder="Ej: Automotor"></div>
        <div class="form-group"><label>Vencimiento Hasta *</label><input type="date" name="venc_hasta" class="input" value="${d.venc_hasta||''}" required></div>
        <div class="form-group"><label>Estado</label><select name="estado" class="input"><option ${d.estado==='Vigente'?'selected':''}>Vigente</option><option ${d.estado==='Vencida'?'selected':''}>Vencida</option><option ${d.estado==='Suspendida'?'selected':''}>Suspendida</option></select></div>
        <div class="form-group"><label>Prima ($)</label><input type="number" name="prima" class="input" value="${d.prima||''}"></div>
      `;

      if (sec === 'siniestros') return `
        <div class="form-group"><label>Nro Siniestro *</label><input type="text" name="nro" class="input" value="${d.nro||''}" required></div>
        <div class="form-group"><label>Cliente *</label><select name="cliente" class="input" required><option value="">Seleccionar...</option>${opt(D.clientes, 'nombre', 'nombre', d.cliente)}</select></div>
        <div class="form-group"><label>Fecha Ocurrencia</label><input type="date" name="fecha" class="input" value="${d.fecha||''}"></div>
        <div class="form-group"><label>Estado</label><select name="estado" class="input"><option ${d.estado==='En Trámite'?'selected':''}>En Trámite</option><option ${d.estado==='Cerrado'?'selected':''}>Cerrado</option><option ${d.estado==='Rechazado'?'selected':''}>Rechazado</option></select></div>
        <div class="form-group"><label>Descripción</label><textarea name="descripcion" class="input" style="height:80px">${d.descripcion||''}</textarea></div>
      `;

      if (sec === 'bienes') return `
        <div class="form-group"><label>Tipo de Bien</label><select name="tipo" class="input"><option value="Vehículo" ${d.tipo==='Vehículo'?'selected':''}>Vehículo</option><option value="Inmueble" ${d.tipo==='Inmueble'?'selected':''}>Inmueble</option></select></div>
        <div class="form-group"><label>Identificación (Patente/Dirección)</label><input type="text" name="patente" class="input" value="${d.patente||''}"></div>
        <div class="form-group"><label>Cliente Propietario</label><select name="cliente" class="input"><option value="">Seleccionar...</option>${opt(D.clientes, 'nombre', 'nombre', d.cliente)}</select></div>
        <div class="form-group"><label>Valor Asegurado</label><input type="number" name="valor" class="input" value="${d.valor||''}"></div>
      `;

      if (sec === 'productores') return `
        <div class="form-group"><label>Nombre Completo</label><input type="text" name="nombre" class="input" value="${d.nombre||''}"></div>
        <div class="form-group"><label>Matrícula</label><input type="text" name="matricula" class="input" value="${d.matricula||''}"></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" class="input" value="${d.email||''}"></div>
      `;

      if (sec === 'companias') return `
        <div class="form-group"><label>Nombre Compañía</label><input type="text" name="nombre" class="input" value="${d.nombre||''}"></div>
        <div class="form-group"><label>CUIT</label><input type="text" name="cuit" class="input" value="${d.cuit||''}"></div>
        <div class="form-group"><label>Contacto</label><input type="text" name="contacto" class="input" value="${d.contacto||''}"></div>
      `;

      return `<p>Formulario no disponible para esta sección.</p>`;
    }

    // ── SEARCH ─────────────────────────────────────
    document.getElementById('global-search').oninput = (e) => {
      const q = e.target.value.toLowerCase();
      const sec = window.appState.currentSection;
      if (sec === 'dashboard' || sec === 'vencimientos') return;
      
      const filtered = window.appState.data[sec].filter(item => 
        Object.values(item).some(v => String(v).toLowerCase().includes(q))
      );
      document.getElementById('main-view').innerHTML = renderTable(sec, filtered);
    };

  </script>
</body>
</html>
